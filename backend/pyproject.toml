[project]
name = "aria-backend"
version = "0.1.0"
description = "Aria Stage 1: Backend Foundation & Deterministic DSP + Critic Pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "librosa>=0.10",
    "numpy>=1.26",
    "soundfile>=0.12",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
